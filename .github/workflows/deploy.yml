name: Deploy pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so the diff against the last built commit works

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # 'lts/*' moved to Node 26, which hangs playwright's Chromium download
          node-version: '22'

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: playwright-

      - name: Restore cached builds
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: dist
          key: slidev-builds-${{ github.run_id }}
          restore-keys: |
            slidev-builds-

      - name: Check restored cache
        run: |
          mkdir -p dist
          echo "Restored cache contents:"
          find dist -mindepth 1 -maxdepth 2 -type d 2>/dev/null || echo "No previous builds in cache"
          ls -la dist/ 2>/dev/null || echo "dist/ is empty"

      - name: Find all Slidev projects
        id: find-projects
        shell: bash
        run: |
          set -euo pipefail
          SEARCH_DIRS=("2025-2026" "Workshops" "2025-2026-Spring" "Design-Studio-III" "Sound-Projects-and-Media")

          projects=()
          for dir in "${SEARCH_DIRS[@]}"; do
            if [ -d "$dir" ]; then
              # Find immediate subdirs that contain slides.md
              while IFS= read -r p; do
                projects+=("$p")
              done < <(find "$dir" -mindepth 1 -maxdepth 1 -type d -exec test -f '{}/slides.md' ';' -print | sort)
            fi
          done

          {
            echo "all_projects<<EOF"
            printf "%s\n" "${projects[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          printf "All Slidev projects found:\n%s\n" "$(printf "%s\n" "${projects[@]}")"

      - name: Detect changed projects
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT_ROOT=dist
          mkdir -p "$OUTPUT_ROOT"

          # Read projects (newline-separated) into an array
          mapfile -t ALL_PROJECTS <<< "${{ steps.find-projects.outputs.all_projects }}"

          CHANGED_FILES=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger - building all projects"
            {
              echo "projects<<EOF"
              printf "%s\n" "${ALL_PROJECTS[@]}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Diff against the last commit that was actually built (stored in the cached dist),
          # so cancelled or failed runs never cause changes to be skipped.
          BASE=""
          [ -f "$OUTPUT_ROOT/.built_sha" ] && BASE="$(cat "$OUTPUT_ROOT/.built_sha")"
          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE="HEAD~1"
          fi
          echo "Diff base: $BASE"
          CHANGED_FILES="$(git diff --name-only "$BASE" "${{ github.sha }}" || true)"

          echo "Changed files:"
          printf "%s\n" "$CHANGED_FILES"

          declare -a CHANGED_PROJECTS=()
          for project in "${ALL_PROJECTS[@]}"; do
            if printf '%s\n' "$CHANGED_FILES" | grep -Fq -- "$project/"; then
              echo "Project changed: $project"
              CHANGED_PROJECTS+=("$project")
            elif [ ! -f "$OUTPUT_ROOT/$project/index.html" ]; then
              echo "Project missing from cache: $project"
              CHANGED_PROJECTS+=("$project")
            fi
          done

          {
            echo "projects<<EOF"
            printf "%s\n" "${CHANGED_PROJECTS[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Projects to build:"
          printf "%s\n" "${CHANGED_PROJECTS[@]:-}"


      - name: Pre-build folder listing
        shell: bash
        run: |
          echo "------ All Slidev projects found ------"
          printf "%s\n" "${{ steps.find-projects.outputs.all_projects }}"
          echo "------ Projects to build this run ------"
          printf "%s\n" "${{ steps.changed.outputs.projects }}"
          echo "------ Existing builds in dist/ ------"
          find dist -mindepth 1 -maxdepth 2 -type d 2>/dev/null || echo "No existing builds"


      - name: Build changed Slidev projects
        shell: bash
        run: |
          set -euxo pipefail
          OUTPUT_ROOT=dist
          mkdir -p "$OUTPUT_ROOT"
          ERROR=0
          BUILT_COUNT=0

          PROJECTS_TO_BUILD="${{ steps.changed.outputs.projects }}"

          if [ -z "$PROJECTS_TO_BUILD" ]; then
            echo "No projects need to be built"
            echo "::notice::No changes detected in Slidev projects, deploying existing builds"
          else
            while IFS= read -r folder; do
              [ -z "$folder" ] && continue
              if [ -d "$folder" ] && [ -f "$folder/slides.md" ]; then
                echo "============ Processing: $folder ============"
                if [ ! -f "$folder/package.json" ]; then
                  echo "::error:: $folder is missing package.json"
                  ERROR=1
                  continue
                fi
                if [ ! -f "$folder/pnpm-lock.yaml" ]; then
                  echo "::error:: $folder is missing pnpm-lock.yaml"
                  ERROR=1
                  continue
                fi

                # Remove old build if exists
                if [ -d "$OUTPUT_ROOT/$folder" ]; then
                  echo "Removing old build for $folder"
                  rm -rf "$OUTPUT_ROOT/$folder"
                fi

                echo "--> Installing dependencies in $folder..."
                cd "$folder"
                # Browser download is done separately below, with its own short timeout
                export PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
                timeout 5m pnpm install --frozen-lockfile || { echo "::error:: pnpm install failed in $folder"; ERROR=1; cd -; continue; }
                echo "--> Dependencies installed in $folder"
                # Slidev resolves playwright-chromium from the deck itself; add it in CI only (no lockfile change)
                if [ ! -d node_modules/playwright-chromium ]; then
                  timeout 3m pnpm add -D playwright-chromium --lockfile=false || echo "::warning:: could not add playwright-chromium in $folder"
                fi
                unset PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
                HAVE_BROWSER=1
                timeout 4m pnpm exec playwright install chromium || { echo "::warning:: chromium unavailable in $folder, skipping PDF"; HAVE_BROWSER=0; }
                echo "--> Building Slidev presentation in $folder"
                # Build into a temp dir and move on success, so a killed build never leaves a partial output
                TMP_OUT="$RUNNER_TEMP/out/$folder"
                rm -rf "$TMP_OUT"; mkdir -p "$(dirname "$TMP_OUT")"
                BUILD_ARGS=(--base "/$folder/" --out "$TMP_OUT" --wait-until "none")
                # PDF export is best-effort: fall back to a plain build so the site still deploys
                if [ "$HAVE_BROWSER" = 1 ] && timeout 5m pnpm exec slidev build --download "${BUILD_ARGS[@]}"; then
                  :
                else
                  echo "::warning:: building $folder without PDF"
                  rm -rf "$TMP_OUT"
                  timeout 5m pnpm exec slidev build "${BUILD_ARGS[@]}" || { echo "::error:: Slidev build failed in $folder"; ERROR=1; cd -; continue; }
                fi
                cd -
                mkdir -p "$(dirname "$OUTPUT_ROOT/$folder")"
                mv "$TMP_OUT" "$OUTPUT_ROOT/$folder"
                echo "--> Build complete for $folder."
                if [ -d "$OUTPUT_ROOT/$folder" ]; then
                  BUILT_COUNT=$((BUILT_COUNT + 1))
                else
                  echo "::error:: Expected output folder $OUTPUT_ROOT/$folder not found"
                  ERROR=1
                  continue
                fi
                if [ ! -f "$OUTPUT_ROOT/$folder/index.html" ]; then
                  echo "::error:: No index.html produced in $OUTPUT_ROOT/$folder!"
                  ERROR=1
                  continue
                fi
              fi
            done <<< "$PROJECTS_TO_BUILD"
            echo "::notice::Built $BUILT_COUNT project(s) this run"
          fi

          echo "------ Final dist structure ------"
          find "$OUTPUT_ROOT" -maxdepth 3 -type d

          # Only a fully successful build advances the diff base
          if [ "$ERROR" -eq 0 ]; then
            echo "${{ github.sha }}" > "$OUTPUT_ROOT/.built_sha"
          fi

          if [ "$ERROR" -ne 0 ]; then
            echo "::error:: One or more projects failed to build, check the log above."
            exit 1
          fi

          if ! find "$OUTPUT_ROOT" -type f -name index.html | grep .; then
            echo "::error:: No index.html files found in $OUTPUT_ROOT"
            exit 1
          fi

      - name: Copy root static files
        if: success()
        run: |
          echo "Copying root-level static files to dist..."
          # Copy the main landing page files
          cp -v index.html dist/ || echo "No index.html in root"
          cp -v *.html dist/ 2>/dev/null || echo "No additional HTML files in root"

          # Copy assets and images directories
          if [ -d "assets" ]; then
            cp -rv assets dist/
            echo "Copied assets/ directory"
          fi

          if [ -d "images" ]; then
            cp -rv images dist/
            echo "Copied images/ directory"
          fi

          # Custom domain must be in the artifact root or Pages resets it
          echo "presentations.alptugan.com" > dist/CNAME

          echo "Root static files copied successfully"
          ls -la dist/

      - name: Save builds to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: dist
          key: slidev-builds-${{ github.run_id }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4