<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For loop simulator · p5.js</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef0f4;--panel:#fff;--ink:#14161a;--mute:#5d6470;--line:#d5d9e0;--init:#2f4bff;--cond:#e59a00;--upd:#00996a;--body:#ff3d8b;--code:#14161a;--codeink:#e9ecf1}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101216;--panel:#1a1d23;--ink:#eef0f4;--mute:#9aa2b0;--line:#2c313a;--init:#7b8dff;--cond:#ffbb33;--upd:#2fd39b;--body:#ff6aa5;--code:#0b0c0f}}
:root[data-theme="dark"]{--bg:#101216;--panel:#1a1d23;--ink:#eef0f4;--mute:#9aa2b0;--line:#2c313a;--init:#7b8dff;--cond:#ffbb33;--upd:#2fd39b;--body:#ff6aa5;--code:#0b0c0f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Bricolage Grotesque",system-ui,sans-serif}
main{max-width:1080px;margin:0 auto;padding:20px 16px 40px}
h1{font-weight:800;font-size:clamp(28px,5vw,44px);line-height:1.05;margin:8px 0 4px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 20px;max-width:60ch}
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:16px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
h2{font-size:15px;font-weight:600;margin:0 0 10px;color:var(--mute)}
.ctl{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mute);gap:4px}
input,select{font:700 16px "JetBrains Mono",monospace;padding:8px;border:2px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}
label.i input{border-color:var(--init)}label.c select,label.c input{border-color:var(--cond)}label.u input{border-color:var(--upd)}
.lim{display:grid;grid-template-columns:70px 1fr;gap:6px}
pre{margin:0;background:var(--code);color:var(--codeink);padding:14px;border-radius:8px;font:400 15px/1.7 "JetBrains Mono",monospace;overflow-x:auto;white-space:pre}
pre span{border-radius:4px;padding:1px 3px;transition:background .15s}
.init{color:var(--init)}.cond{color:var(--cond)}.upd{color:var(--upd)}.bod{color:var(--body)}
pre .init{color:#8b9bff}pre .cond{color:#ffc44d}pre .upd{color:#3fe0a8}pre .bod{color:#ff8ab8}
pre .on.init{background:#2f4bff;color:#fff}pre .on.cond{background:#e59a00;color:#111}pre .on.upd{background:#00996a;color:#fff}pre .on.bod{background:#ff3d8b;color:#fff}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
button{font:600 15px "Bricolage Grotesque",sans-serif;padding:10px 16px;border-radius:6px;border:2px solid var(--ink);background:var(--panel);color:var(--ink);cursor:pointer}
button.pri{background:var(--ink);color:var(--bg)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--init);outline-offset:2px}
.say{min-height:3.2em;padding:10px 12px;border-left:6px solid var(--line);background:var(--bg);border-radius:0 6px 6px 0;font-size:16px}
.say.init{border-color:var(--init)}.say.cond{border-color:var(--cond)}.say.upd{border-color:var(--upd)}.say.bod{border-color:var(--body)}.say.warn{border-color:#d33}
.iv{display:flex;align-items:baseline;gap:12px;margin:0 0 8px}
.big{font:700 54px/1 "JetBrains Mono",monospace}
.tape{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;min-height:34px}
.chip{font:700 14px "JetBrains Mono",monospace;padding:4px 9px;border-radius:99px;border:2px solid var(--line);color:var(--mute)}
.chip.now{background:var(--body);border-color:var(--body);color:#fff}
#holder{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
#holder canvas{display:block;width:100%!important;height:auto!important}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hint{font-size:14px;color:var(--mute);margin:10px 0 0}
ul{margin:6px 0 0;padding-left:20px}li{margin:4px 0}
</style>
</head>
<body>
<main>
<h1>How a for loop works</h1>
<p class="sub">A for loop repeats a block of code and changes one number each time. Set the three parts, then step through the loop and watch the drawing build up.</p>

<div class="grid">
<div>
<section class="card">
<h2>1. Set the three parts</h2>
<div class="ctl">
<label class="i">Start<input id="start" type="number" value="0" step="1"></label>
<label class="c">Keep going while<div class="lim"><select id="op"><option>&lt;</option><option>&lt;=</option></select><input id="limit" type="number" value="8" step="1"></div></label>
<label class="u">Add each round<input id="step" type="number" value="1" step="0.5"></label>
</div>
<label style="margin-bottom:12px">What to draw in each round
<select id="preset">
<option value="0">A row of circles</option>
<option value="1">Circles that grow</option>
<option value="2">A colour ramp</option>
<option value="3">Lines around a centre</option>
</select></label>
<pre id="code" aria-label="Generated code"></pre>
<div class="btns">
<button class="pri" id="bStep">Step</button>
<button id="bPlay">Play</button>
<button id="bReset">Reset</button>
<label class="row" style="flex-direction:row;font-size:13px">Speed <input id="speed" type="range" min="1" max="10" value="4" style="width:100px;padding:0"></label>
</div>
<div class="say" id="say" aria-live="polite"></div>
</section>
</div>

<div>
<section class="card">
<h2>2. Watch it run</h2>
<div class="iv"><span class="big" id="ival">i</span><span id="ilabel" style="color:var(--mute)">the counter</span></div>
<div id="holder"></div>
<div class="tape" id="tape" aria-label="Values of i so far"></div>
<p class="hint" id="summary"></p>
</section>
</div>
</div>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const MAX=60;
const presets=[
 {code:"circle(30 + i * 50, 150, 40);",draw:(p,i)=>{p.fill(255,61,139);p.noStroke();p.circle(30+i*50,150,40);return[30+i*50,185]}},
 {code:"circle(30 + i * 50, 150, 10 + i * 8);",draw:(p,i)=>{p.fill(0,153,106);p.noStroke();p.circle(30+i*50,150,10+i*8);return[30+i*50,225]}},
 {code:"fill(i * 25 % 360, 80, 95);\n  rect(i * 50, 90, 50, 120);",draw:(p,i)=>{p.colorMode(p.HSB,360,100,100);p.fill(((i*25)%360+360)%360,80,95);p.noStroke();p.rect(i*50,90,50,120);p.colorMode(p.RGB,255);return[i*50+25,230]}},
 {code:"let a = i * 30;\n  line(300, 150, 300 + cos(a) * 120, 150 + sin(a) * 120);",draw:(p,i)=>{const a=p.radians(i*30);p.stroke(47,75,255);p.strokeWeight(4);p.line(300,150,300+Math.cos(a)*120,150+Math.sin(a)*120);p.noStroke();return[300+Math.cos(a)*138,150+Math.sin(a)*138]}}
];
let S; // state
const num=(id,d)=>{const v=parseFloat($(id).value);return isNaN(v)?d:v};
const r2=x=>Math.round(x*100)/100;
function params(){return{start:num("start",0),limit:num("limit",8),step:num("step",1),op:$("op").value,pre:+$("preset").value}}
const test=(P,i)=>P.op==="<"?i<P.limit:i<=P.limit;
function reset(){stop();S={phase:"ready",i:null,drawn:[],chk:null,P:params(),msg:""};ui()}
function next(){
 const P=S.P;
 switch(S.phase){
  case"ready":S.i=P.start;S.phase="init";break;
  case"init":case"update":S.chk=test(P,S.i);S.phase="check";break;
  case"check":S.phase=S.chk?"body":"done";break;
  case"body":S.drawn.push(S.i);S.phase="update";S.i=r2(S.i+P.step);break;
 }
 if(S.phase==="body"&&S.drawn.length>=MAX){S.phase="stopped"}
 ui();
}
let timer=null;
function play(){if(timer){stop();return}
 if(S.phase==="done"||S.phase==="stopped")reset();
 $("bPlay").textContent="Pause";
 const tick=()=>{if(S.phase==="done"||S.phase==="stopped"){stop();return}next();timer=setTimeout(tick,1100-$("speed").value*100)};tick()}
function stop(){clearTimeout(timer);timer=null;$("bPlay").textContent="Play"}
function ui(){
 const P=S.P,ph=S.phase,on=k=>(ph===k?" on":"");
 const chkOn=ph==="check"?" on":"";
 $("code").innerHTML=
 `<span class="kw">for</span> (<span class="init${on("init")}">let i = ${P.start}</span>; <span class="cond${chkOn}">i ${P.op.replace("<","&lt;")} ${P.limit}</span>; <span class="upd${on("update")}">i += ${P.step}</span>) {\n  <span class="bod${on("body")}">${presets[P.pre].code.replace(/</g,"&lt;")}</span>\n}`;
 let m="Press Step to run one action at a time, or Play to run all of them.",c="";
 if(ph==="init"){c="init";m=`<b>Start.</b> i is set to ${P.start}. This happens once, before anything else.`}
 if(ph==="check"){c="cond";m=`<b>Check.</b> Is ${S.i} ${P.op} ${P.limit}? <b>${S.chk?"Yes":"No"}.</b> ${S.chk?"Run the code inside the braces.":"Stop. The loop is finished."}`}
 if(ph==="body"){c="bod";m=`<b>Run the body</b> with i = ${S.i}. Shape number ${S.drawn.length+1} is drawn.`}
 if(ph==="update"){c="upd";m=`<b>Update.</b> i grows by ${P.step} and is now ${S.i}. Then the check happens again.`}
 if(ph==="done"){c="cond";m=`<b>Done.</b> The body ran ${S.drawn.length} time${S.drawn.length===1?"":"s"}. Nothing else in the loop happens after this.`}
 if(ph==="stopped"){c="warn";m=`<b>Stopped after ${MAX} rounds.</b> The check never turns false with these settings, so this is an infinite loop. In p5.js it would freeze your sketch.`}
 $("say").className="say "+c;$("say").innerHTML=m;
 $("ival").textContent=S.i===null?"i = ?":"i = "+S.i;
 $("ilabel").textContent=S.i===null?"not created yet":"the counter";
 $("tape").innerHTML=S.drawn.map((v,k)=>`<span class="chip${ph==="update"&&k===S.drawn.length-1?" now":""}">${v}</span>`).join("");
 let n=0,i=P.start;while(test(P,i)&&n<MAX){n++;i=r2(i+P.step)}
 $("summary").textContent=n>=MAX?"With these settings the loop would never end.":`With these settings the body runs ${n} time${n===1?"":"s"}.`;
}
$("bStep").onclick=()=>{stop();if(S.phase==="done"||S.phase==="stopped")reset();else next()};
$("bPlay").onclick=play;$("bReset").onclick=reset;
["start","limit","step","op","preset"].forEach(id=>$(id).addEventListener("input",reset));
new p5(p=>{
 p.setup=()=>{p.createCanvas(600,300);p.textFont("monospace");p.textAlign(p.CENTER,p.CENTER)};
 p.draw=()=>{
  p.background(255);p.stroke(225);p.strokeWeight(1);
  for(let x=0;x<=600;x+=50)p.line(x,0,x,300);for(let y=0;y<=300;y+=50)p.line(0,y,600,y);
  if(!S)return;
  const pr=presets[S.P.pre];
  S.drawn.forEach((v,k)=>{p.push();const pos=pr.draw(p,v);p.pop();
   p.noStroke();p.fill(20,22,26);p.textSize(15);p.text(v,Math.max(12,Math.min(588,pos[0])),Math.max(12,Math.min(288,pos[1])))});
 };
},"holder");
reset();
</script>
</body>
</html>
